<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meow-mory Match 🐾</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <style>
      .game-stats {
        display: flex;
        gap: 22px;
        flex-wrap: wrap;
        justify-content: center;
        margin: 6px 0 4px 0;
        color: #ffffff;
        font-family: "Pixelify Sans", monospace;
        font-size: 1rem;
      }

      .game-stats span {
        background-color: rgba(116, 80, 120, 0.6);
        border: 2px solid #db9498;
        border-radius: 14px;
        padding: 6px 16px;
      }

      /* Memory Board */
      .memory-board {
        position: relative;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        width: 100%;
        max-width: 460px;
        margin: 26px auto 10px auto;
        z-index: 5;
      }

      .memory-card {
        aspect-ratio: 1 / 1;
        perspective: 800px;
        cursor: pointer;
      }

      .memory-card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        transition: transform 0.5s;
        transform-style: preserve-3d;
      }

      .memory-card.flipped .memory-card-inner {
        transform: rotateY(180deg);
      }

      .memory-card.matched .memory-card-inner {
        transform: rotateY(180deg);
      }

      .memory-card.matched .memory-card-front {
        box-shadow: 0 0 0 3px #f6f1d8, 0 6px 14px rgba(0, 0, 0, 0.35);
        animation: matchPulse 0.5s ease;
      }

      @keyframes matchPulse {
        0% { transform: rotateY(180deg) scale(1); }
        50% { transform: rotateY(180deg) scale(1.12); }
        100% { transform: rotateY(180deg) scale(1); }
      }

      .memory-card-back,
      .memory-card-front {
        position: absolute;
        inset: 0;
        border-radius: 10px;
        backface-visibility: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
      }

      .memory-card-back {
        background: linear-gradient(160deg, #8a5f8f, #745078);
        border: 2px dashed #db9498;
        font-size: 1.7rem;
      }

      .memory-card-front {
        background-color: #ffffff;
        padding: 4px;
        transform: rotateY(180deg);
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      }

      .memory-card-front img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 6px;
      }

      .memory-card.matched {
        cursor: default;
      }

      .win-banner {
        display: none;
        margin: 6px auto 0 auto;
        max-width: 420px;
        text-align: center;
        background-color: rgba(116, 80, 120, 0.85);
        border: 2px dashed #db9498;
        border-radius: 12px;
        padding: 18px 24px;
        color: #ffffff;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }

      .win-banner p {
        margin: 0 0 12px 0;
        font-size: 1.15rem;
        line-height: 1.5;
      }

      .play-again-btn {
        display: inline-block;
        padding: 10px 25px;
        background-color: transparent;
        color: #ffffff;
        border: 2px solid #db9498;
        border-radius: 20px;
        font-family: "Pixelify Sans", monospace;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .play-again-btn:hover {
        background-color: rgba(255, 255, 255, 0.2);
        transform: scale(1.05);
      }

      .back-btn {
        display: inline-block;
        padding: 10px 25px;
        background-color: transparent;
        color: #ffffff;
        border: 2px solid #db9498;
        border-radius: 20px;
        font-family: "Pixelify Sans", monospace;
        font-size: 1.1rem;
        text-decoration: none;
        transition: all 0.3s ease;
      }

      .back-btn:hover {
        background-color: rgba(255, 255, 255, 0.2);
        transform: scale(1.05);
      }

      @media (max-width: 768px) {
        .memory-board {
          max-width: 340px;
          gap: 10px;
        }

        .memory-card-back {
          font-size: 1.3rem;
        }
      }
    </style>
  </head>
  <body>

    <audio id="persistentAudio" src="song/bday.mp3" loop></audio>

    <div class="cats-bg"></div>
    <!-- Floating Flowers Background -->
    <div class="flowers-container">
      <div class="flower">🌸</div>
      <div class="flower">🌺</div>
      <div class="flower">🌸</div>
      <div class="flower">💮</div>
      <div class="flower">🌺</div>
      <div class="flower">🌸</div>
      <div class="flower">💮</div>
      <div class="flower">🌸</div>
    </div>

    <div class="container">
      <div id="mainTitle" style="font-size: 42px; color: #ffffff; margin-top: 30px;">Meow-mory Match</div>
      <div id="subTitle" style="margin-bottom: 10px; color: #ffffff;">find all the kitty pairs!</div>

      <div class="game-stats">
        <span id="movesStat">Moves: 0</span>
        <span id="matchesStat">Matches: 0 / 8</span>
        <span id="bestStat">Best: --</span>
      </div>

      <div class="memory-board" id="memoryBoard"></div>

      <div class="win-banner" id="winBanner">
        <p id="winText"></p>
        <button class="play-again-btn" id="playAgainBtn">🔄 Play Again</button>
      </div>

      <!-- Nav -->
      <div style="display: flex; gap: 15px; justify-content: center; margin-top: 40px; flex-wrap: wrap;">
        <a href="index.html" class="back-btn">← back to cake</a>
        <a href="gallery.html" class="back-btn" style="border-color: #f6f1d8; color: #f6f1d8;">gallery ✨</a>
        <a href="cats.html" class="back-btn">her cats 🐾</a>
      </div>
    </div>

    <script>
      const catPhotos = [
        "photos/c0.jpg",
        "photos/c1.jpg",
        "photos/c2.jpg",
        "photos/c3.jpg",
        "photos/c4.jpg",
        "photos/c5.jpg",
        "photos/c6.jpg",
        "photos/c7.jpg",
      ];

      const board = document.getElementById("memoryBoard");
      const movesStat = document.getElementById("movesStat");
      const matchesStat = document.getElementById("matchesStat");
      const bestStat = document.getElementById("bestStat");
      const winBanner = document.getElementById("winBanner");
      const winText = document.getElementById("winText");
      const playAgainBtn = document.getElementById("playAgainBtn");

      let moves = 0;
      let matches = 0;
      let lockBoard = false;
      let firstCard = null;
      let secondCard = null;

      function shuffle(array) {
        const a = array.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function updateStats() {
        movesStat.textContent = `Moves: ${moves}`;
        matchesStat.textContent = `Matches: ${matches} / 8`;
      }

      function loadBestScore() {
        const best = localStorage.getItem("memoryBestMoves");
        bestStat.textContent = best ? `Best: ${best} moves` : "Best: --";
      }

      function maybeSaveBestScore() {
        const best = parseInt(localStorage.getItem("memoryBestMoves"));
        if (!best || moves < best) {
          localStorage.setItem("memoryBestMoves", moves);
        }
        loadBestScore();
      }

      function buildBoard() {
        board.innerHTML = "";
        winBanner.style.display = "none";
        moves = 0;
        matches = 0;
        lockBoard = false;
        firstCard = null;
        secondCard = null;
        updateStats();

        const deck = shuffle([...catPhotos, ...catPhotos]);

        deck.forEach((src) => {
          const card = document.createElement("div");
          card.className = "memory-card";
          card.dataset.img = src;

          card.innerHTML = `
            <div class="memory-card-inner">
              <div class="memory-card-back">🐾</div>
              <div class="memory-card-front">
                <img src="${src}" alt="Cat" />
              </div>
            </div>
          `;

          card.addEventListener("click", () => onCardClick(card));
          board.appendChild(card);
        });
      }

      function onCardClick(card) {
        if (lockBoard) return;
        if (card === firstCard) return;
        if (card.classList.contains("matched")) return;

        card.classList.add("flipped");

        if (!firstCard) {
          firstCard = card;
          return;
        }

        secondCard = card;
        lockBoard = true;
        moves++;
        updateStats();

        if (firstCard.dataset.img === secondCard.dataset.img) {
          firstCard.classList.add("matched");
          secondCard.classList.add("matched");
          matches++;
          updateStats();
          resetTurn();

          if (matches === catPhotos.length) {
            setTimeout(showWin, 400);
          }
        } else {
          setTimeout(() => {
            firstCard.classList.remove("flipped");
            secondCard.classList.remove("flipped");
            resetTurn();
          }, 800);
        }
      }

      function resetTurn() {
        firstCard = null;
        secondCard = null;
        lockBoard = false;
      }

      function showWin() {
        maybeSaveBestScore();
        winText.textContent = `You matched all the kitties in ${moves} moves! 🎉`;
        winBanner.style.display = "block";
        spawnWinSparkles();
      }

      function spawnWinSparkles() {
        const sparkleChars = ["✨", "⭐", "💫", "🌟"];
        for (let i = 0; i < 24; i++) {
          const sparkle = document.createElement("span");
          sparkle.className = "sparkle";
          sparkle.textContent =
            sparkleChars[Math.floor(Math.random() * sparkleChars.length)];
          sparkle.style.left = `${Math.random() * 100}%`;
          sparkle.style.top = `${Math.random() * 100}%`;
          sparkle.style.animationDelay = `${Math.random() * 0.5}s`;
          sparkle.style.fontSize = `${1 + Math.random() * 1}rem`;
          board.appendChild(sparkle);
          setTimeout(() => sparkle.remove(), 1600);
        }
      }

      playAgainBtn.addEventListener("click", buildBoard);

      loadBestScore();
      buildBoard();

      // Keep the birthday song playing continuously across pages
      const bgMusic = document.getElementById("persistentAudio");

      window.addEventListener("load", () => {
        const isPlaying = localStorage.getItem("isPlaying") === "true";
        const savedTime = parseFloat(localStorage.getItem("audioTime")) || 0;

        bgMusic.currentTime = savedTime;
        if (isPlaying) {
          bgMusic.volume = 0.5;
          bgMusic.play().catch((e) => console.log("Autoplay blocked:", e));
        }
      });

      setInterval(() => {
        if (!bgMusic.paused) {
          localStorage.setItem("audioTime", bgMusic.currentTime);
          localStorage.setItem("isPlaying", "true");
        }
      }, 500);
      // === Click-the-Cats Easter Egg ===
      // The background is wall-to-wall cats and cat-themed decorations, so
      // any click on the decorative background (not on buttons/cards/other
      // UI) pops a little heart/paw + "meow~" right at the cursor.
      (function () {
        const catReactionEmojis = ["❤️", "🐾"];
        const catReactionWords = ["meow~", "purr~", "mrow!", "nya~"];

        function spawnCatReaction(clientX, clientY) {
          const el = document.createElement("div");
          el.className = "cat-reaction";
          el.style.left = `${clientX}px`;
          el.style.top = `${clientY}px`;

          const emoji = document.createElement("span");
          emoji.className = "cat-reaction-emoji";
          emoji.textContent =
            catReactionEmojis[
              Math.floor(Math.random() * catReactionEmojis.length)
            ];

          const bubble = document.createElement("div");
          bubble.className = "cat-reaction-bubble";
          bubble.textContent =
            catReactionWords[
              Math.floor(Math.random() * catReactionWords.length)
            ];

          el.appendChild(emoji);
          el.appendChild(bubble);
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 1000);
        }

        document.addEventListener("click", (e) => {
          const target = e.target;
          const isBackgroundClick =
            target === document.body ||
            target === document.documentElement ||
            (target.classList && target.classList.contains("container"));

          if (!isBackgroundClick) return;
          spawnCatReaction(e.clientX, e.clientY);
        });
      })();

    </script>
  </body>
</html>
